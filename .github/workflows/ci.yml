name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
      HAS_SUPABASE_SECRETS: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
      HAS_E2E_SECRETS: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' && secrets.E2E_OWNER_EMAIL != '' && secrets.E2E_OWNER_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: E2E (when required secrets are configured)
        run: |
          if [ "$HAS_E2E_SECRETS" = "true" ]; then
            npx playwright install --with-deps chromium
            npm run -w @myrivo/web e2e
          else
            echo "Skipping e2e: missing one or more required secrets (NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, E2E_OWNER_EMAIL, E2E_OWNER_PASSWORD)."
          fi
      - name: Verify platform rollout (when Supabase secrets are configured)
        run: |
          if [ "$HAS_SUPABASE_SECRETS" = "true" ]; then
            printf "NEXT_PUBLIC_SUPABASE_URL=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\n" "$NEXT_PUBLIC_SUPABASE_URL" "$SUPABASE_SERVICE_ROLE_KEY" > .env.ci
            node scripts/verify-platform-rollout.mjs --env-file=.env.ci
          else
            echo "Skipping rollout verification: missing NEXT_PUBLIC_SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY."
          fi
      - name: Digital products release acceptance (promotion only)
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        env:
          MYRIVO_DIGITAL_ACCEPTANCE_FIXTURE_BASE64: ${{ secrets.MYRIVO_DIGITAL_ACCEPTANCE_FIXTURE_BASE64 }}
          MYRIVO_DIGITAL_APPROVED_NONPROD_HOST: ${{ vars.MYRIVO_DIGITAL_APPROVED_NONPROD_HOST }}
          MYRIVO_DIGITAL_TEST_RECIPIENT: ${{ secrets.MYRIVO_DIGITAL_TEST_RECIPIENT }}
          MYRIVO_DIGITAL_ACCEPTANCE_EVIDENCE_HMAC_KEY: ${{ secrets.MYRIVO_DIGITAL_ACCEPTANCE_EVIDENCE_HMAC_KEY }}
          MYRIVO_STRIPE_DISPUTE_HELPER_URL: ${{ secrets.MYRIVO_STRIPE_DISPUTE_HELPER_URL }}
          MYRIVO_STRIPE_DISPUTE_HELPER_TOKEN: ${{ secrets.MYRIVO_STRIPE_DISPUTE_HELPER_TOKEN }}
          MYRIVO_STRIPE_DISPUTE_HELPER_SIGNING_KEY: ${{ secrets.MYRIVO_STRIPE_DISPUTE_HELPER_SIGNING_KEY }}
          MYRIVO_STRIPE_DISPUTE_HELPER_ORIGIN: ${{ secrets.MYRIVO_STRIPE_DISPUTE_HELPER_ORIGIN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          STRIPE_STUB_MODE: "false"
          RESEND_API_KEY: ${{ secrets.RESEND_TEST_API_KEY }}
        run: |
          fixture_file="$(mktemp)"
          evidence_file="$(mktemp)"
          trap 'rm -f "$fixture_file" "$evidence_file"' EXIT
          printf '%s' "$MYRIVO_DIGITAL_ACCEPTANCE_FIXTURE_BASE64" | base64 --decode > "$fixture_file"
          MYRIVO_DIGITAL_ACCEPTANCE_FIXTURE="$fixture_file" MYRIVO_DIGITAL_ACCEPTANCE_EVIDENCE_OUTPUT="$evidence_file" npm run verify:digital-products-release
